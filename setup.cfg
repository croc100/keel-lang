[flake8]
max-line-length = 100
# E731 / E741: a two-character local and a short lambda are clearer than the
# alternatives in the places they are used here, and both are purely
# stylistic. E402: a few modules import after a sys.path adjustment or after
# a deliberate docstring block.
extend-ignore = E731,E741,E402,W503,W504
exclude = .git,__pycache__,build,dist
