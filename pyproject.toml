[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keel-lang"
version = "0.2.0"
description = "A programming language whose only reader is a machine: proof-carrying, physically typed, down to x86-64 bytes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["language", "verification", "wcet", "units", "safety-critical",
            "code-generation", "content-addressed"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
  "Topic :: Scientific/Engineering",
]

# No dependencies. On purpose: a trust root you have to read should not
# import one you have not.
dependencies = []

[project.scripts]
keel = "keel.__main__:main"

[project.urls]
Homepage = "https://github.com/croc100/keel-lang"

[tool.setuptools]
packages = ["keel"]
